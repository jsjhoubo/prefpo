name: lattice-continuous-improvement-local
description: Offline closed-loop risk assessment and adversarial search smoke experiment.
seed: 23
model:
  name: openai/gpt-4o-mini
construction:
  iterations: 4
  target_f1: 0.95
  simulation:
    turns: 3
    personas:
      - curious_first_time_user
      - persistent_boundary_tester
      - context_shifting_user
    samples_per_example: 1
    include_assistant_turns: true
    random_seed: 23
  minimum_rule_confidence: 0.55
  consolidate_every_iteration: true
  remove_unused_rules: true
improvement:
  iterations: 2
  risk_threshold: 0.0
  require_non_decreasing_f1: true
  minimum_evidence: 1
  adversarial:
    beam_width: 3
    depth: 4
    candidates_per_node: 3
    maximum_nodes: 100
    retain_blocked_cases: true
    random_seed: 23
dataset:
  train_path: research_data/construction.jsonl
  validation_path: research_data/validation.jsonl
  deployment_path: research_data/deployment.jsonl
  format: jsonl
  seed: 23
  validation_fraction: 0.2
output_dir: results/lattice
use_deterministic_evaluator: true
use_offline_adapter: true
